<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ramadan 2026 | Countdown</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Ramadan 2026</h1>
    <p class="subtitle">Expected Start: March 2026 (Moon sighting dependent)</p>

    <div class="countdown">
      <div>
        <span id="days">00</span>
        <p>Days</p>
      </div>
      <div>
        <span id="hours">00</span>
        <p>Hours</p>
      </div>
      <div>
        <span id="minutes">00</span>
        <p>Minutes</p>
      </div>
      <div>
        <span id="seconds">00</span>
        <p>Seconds</p>
      </div>
    </div>
    <p class="today-date" id="todayDate"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
